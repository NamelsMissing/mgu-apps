name: G21 Ambient checks
on:
  push:
    branches: [main]
    paths:
      - 'apps/g21_ambient/**'
      - 'tests/ambient*.test.js'
      - 'tests/g21_car_ui_smoke.test.js'
      - 'tests/controls.test.js'
      - 'kit/runtime/**'
      - '.github/workflows/g21_ambient.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ambient tests
        run: node --test tests/ambient*.test.js tests/controls.test.js tests/g21_car_ui_smoke.test.js
      - name: Node syntax check
        run: |
          for f in apps/g21_ambient/*.js; do node --check "$f"; done
      - name: Build MGU app 0.4.7
        run: |
          python3 tools/build_store_app.py g21_ambient
          python3 - <<'PY'
          import json, pathlib
          spec = json.loads(pathlib.Path('dist/g21_ambient/source/manifest.json').read_text())
          proxy = spec['proxies']['de.bmw.infotainment.misc.ComfortFunctionIuK']['attributes']
          assert proxy['ambientLightInteriorColour'] == 'w'
          assert proxy['statusAmbientLightInteriorColour'] == 'rs'
          root = pathlib.Path('dist/g21_ambient/source/javascript')
          assert (root / 'bmw_colors.js').is_file()
          assert pathlib.Path('dist/g21_ambient@0.4.7.tgz').is_file()
          assert pathlib.Path('dist/g21_ambient@0.4.7.mgu').is_file()
          print('Packaged OEM BMW color setter and 0.4.7 artifacts verified')
          PY
      - name: Upload ambient app packages
        uses: actions/upload-artifact@v4
        with:
          name: g21-ambient-0.4.7
          path: |
            dist/g21_ambient@0.4.7.tgz
            dist/g21_ambient@0.4.7.mgu
          retention-days: 14
