name: Cluster Lyrics checks

on:
  push:
    paths:
      - 'apps/cluster_lyrics/**'
      - 'tests/cluster_lyrics.test.js'
      - 'mgu-repo.json'
      - '.github/workflows/cluster_lyrics.yml'
  pull_request:
    paths:
      - 'apps/cluster_lyrics/**'
      - 'tests/cluster_lyrics.test.js'
      - 'mgu-repo.json'
      - '.github/workflows/cluster_lyrics.yml'

jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Cluster Lyrics unit and renderer socket tests
        run: node tests/cluster_lyrics.test.js
